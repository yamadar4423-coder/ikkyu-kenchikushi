/* スマホ版専用：1画面1問・ボタンで答える */
main{max-width:560px}
.mhead{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:14px;color:var(--sub)}
.mhead .dots{display:flex;gap:5px;margin-left:auto}
.mhead .dots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}
.mhead .dots i.o{background:var(--ok)}
.mhead .dots i.x{background:var(--ng)}
.mhead .dots i.now{outline:2px solid var(--acc);outline-offset:1px}
.sofar{background:var(--mute);border-radius:8px;padding:6px 12px;margin:0 0 10px;font-size:15px}
.sofar b{color:var(--sub);font-weight:600;margin-right:6px}
.qt{font-size:18px;line-height:1.6;margin:4px 0 14px;font-weight:600}
.hbtn{margin:-6px 0 12px;font-size:14px;min-height:38px;border-radius:18px;padding:4px 14px;color:var(--acc)}
.hint{background:var(--acc-bg);border-radius:8px;padding:6px 12px;margin:-6px 0 12px;font-size:15px}
.ans{display:flex;flex-direction:column;gap:10px}
.ans button{font-size:17px;min-height:54px;padding:10px 14px;text-align:left;border-radius:10px;border-width:2px}
.ans button:disabled{cursor:default;opacity:1}
.ans button.o{background:var(--ok-bg);border-color:var(--ok)}
.ans button.x{background:var(--ng-bg);border-color:var(--ng)}
.ans button.dim{opacity:.45}
.fb{margin:14px 0 0;padding:10px 14px;border-radius:8px;font-size:15px}
.fb.o{background:var(--ok-bg)}
.fb.x{background:var(--ng-bg)}
.fb b{font-size:16px}
.next{display:block;width:100%;margin:14px 0 0;font-size:17px;min-height:52px;border-radius:10px}
.slist{list-style:none;padding:0;margin:0}
.slist li{margin:0 0 8px}
.slist button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;font-size:15px;min-height:56px;padding:8px 12px;border-radius:10px}
.slist .no{flex:0 0 2.4em;font-weight:700;color:var(--acc)}
.slist .nm2{flex:1}
.slist .st{font-size:13px;color:var(--sub);white-space:nowrap}
.slist .st.ok{color:var(--ok);font-weight:600}
.grp{font-size:14px;color:var(--sub);margin:14px 0 6px;font-weight:600}
.big{font-size:40px;font-weight:700;text-align:center;margin:6px 0}
.wide{display:block;width:100%;font-size:16px;min-height:50px;margin:8px 0 0;border-radius:10px}
.qfig svg.fig{margin:0 auto 8px}
.qfig figure{margin:0;text-align:center;font-size:13px;color:var(--sub)}
</style>
</head>

 {q:'(b) 門型ラーメン（両端ピン）。n = 2 + 2 は？',f:'hb',a:['4','2','6'],e:'ピン 2か所 × 2つ = 4。'},
 {q:'(b) m = 4 + 3 + 2 − 8 は？',f:'hb',s:'n = 4、s = 3、r = 2、k = 4',a:['1（1次不静定）','0（静定）','2（2次不静定）'],e:'4 + 3 + 2 − 8 = 1。1次不静定。'},
 {q:'(c) 3ヒンジラーメン。ヒンジが1つ増えると、不静定の次数は？',f:'hc',s:'(b) は 1次不静定。(c) は m = 0 で静定',a:['1つ減る','1つ増える','変わらない'],e:'ヒンジはモーメントを伝えないので、条件が1つ増えて次数が1つ減る。'}
]}
];

/* ============ 保存 ============ */
function st(){ var s=K.rd(KEY); s.sets=s.sets||{}; s.wrong=s.wrong||[]; return s; }
function save(s){ K.wr(KEY,s); }
function qid(si,qi){ return (si+1)+'-'+(qi+1); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(t){ return String(t).replace(/[&<>]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

var view=document.getElementById('view');

/* ============ 一覧 ============ */
function home(){
  var s=st(), h='', grp='';
  delete s.cur; save(s);
  h+='<p style="margin:0 0 6px">1セット5問・約3分。途中でやめても、次に開くと続きから始まります。</p>';
  if(s.wrong.length) h+='<button class="pri wide" id="gowrong">前に間違えた問題だけ（'+s.wrong.length+' 問）</button>';
  var nx=nextSet(s);
  if(nx!=null) h+='<button class="'+(s.wrong.length?'':'pri ')+'wide" id="gonext">次のセット：'+(nx+1)+' '+esc(SETS[nx].t)+'</button>';
  h+='<ul class="slist">';
  SETS.forEach(function(set,i){
    if(set.g!==grp){ grp=set.g; h+='</ul><div class="grp">'+grp+'</div><ul class="slist">'; }
    var r=s.sets[i+1], lab='未';
    if(r) lab='<span class="'+(r.best===5?'ok':'')+'">最高 '+r.best+'/5</span>';
    h+='<li><button data-set="'+i+'"><span class="no">'+(i+1)+'</span><span class="nm2">'+esc(set.t)+'</span><span class="st">'+lab+'</span></button></li>';
  });
  h+='</ul>';
  view.innerHTML=h;
  Array.prototype.forEach.call(view.querySelectorAll('[data-set]'),function(b){
    b.addEventListener('click',function(){ start(+b.getAttribute('data-set')); });
  });
  var gw=document.getElementById('gowrong'); if(gw) gw.addEventListener('click',startWrong);
  var gn=document.getElementById('gonext'); if(gn) gn.addEventListener('click',function(){ start(nx); });
  scrollTo(0,0);
}
function nextSet(s){
  for(var i=0;i<SETS.length;i++){ if(!s.sets[i+1]) return i; }
  for(var j=0;j<SETS.length;j++){ if(s.sets[j+1].best<5) return j; }
  return null;
}

/* ============ 出題 ============ */
function start(si){
  var s=st();
  s.cur={mode:'set', set:si, list:SETS[si].q.map(function(_,qi){ return qid(si,qi); }), i:0, res:[]};
  save(s); ask();
}
function startWrong(){
  var s=st();
  s.cur={mode:'wrong', list:shuffle(s.wrong).slice(0,5), i:0, res:[]};
  save(s); ask();
}
function getQ(id){ var p=id.split('-'); return {set:SETS[p[0]-1], q:SETS[p[0]-1].q[p[1]-1], si:p[0]-1}; }

function ask(){
  var s=st(), c=s.cur;
  if(!c) return home();
  if(c.i>=c.list.length) return done();
  var o=getQ(c.list[c.i]), q=o.q, h='';
  var dots=c.list.map(function(_,k){ var r=c.res[k]; return '<i class="'+(r===true?'o':r===false?'x':'')+(k===c.i?' now':'')+'"></i>'; }).join('');
  var title=c.mode==='wrong' ? '間違えた問題（セット'+(o.si+1)+'）' : 'セット'+(o.si+1)+' '+esc(o.set.t);
  h+='<div class="mhead"><span>'+title+'</span><span class="dots">'+dots+'</span></div>';
  if(q.f) h+='<div class="qfig">'+FIG[q.f]()+'</div>';
  if(q.s) h+='<div class="sofar"><b>ここまで</b>'+esc(q.s)+'</div>';
  h+='<div class="qt">'+(c.i+1)+'. '+esc(q.q)+'</div>';
  if(q.h) h+='<button class="hbtn" id="hbtn">ヒントを見る</button><div class="hint" id="hint" hidden>ヒント：'+esc(q.h)+'</div>';
  h+='<div class="ans">';
  shuffle(q.a.map(function(t,k){ return {t:t,k:k}; })).forEach(function(x){
    h+='<button data-k="'+x.k+'">'+esc(x.t)+'</button>';
  });
  h+='</div><div id="after"></div>';
  h+='<div class="tools" style="margin-top:18px"><button id="quit">一覧へ戻る（ここまで保存）</button></div>';
  view.innerHTML=h;
  Array.prototype.forEach.call(view.querySelectorAll('.ans button'),function(b){
    b.addEventListener('click',function(){ answer(+b.getAttribute('data-k')); });
  });
  document.getElementById('quit').addEventListener('click',function(){ home(); });
  var hb=document.getElementById('hbtn');
  if(hb) hb.addEventListener('click',function(){ document.getElementById('hint').hidden=false; hb.remove(); });
  scrollTo(0,0);
}

function answer(k){
  var s=st(), c=s.cur, id=c.list[c.i], q=getQ(id).q, ok=(k===0);
  c.res[c.i]=ok; c.i++;  /* 答えた時点で進める（閉じても同じ問題を二度解かない） */
  var wi=s.wrong.indexOf(id);
  if(ok && wi>=0) s.wrong.splice(wi,1);
  if(!ok && wi<0) s.wrong.push(id);
  save(s); K.touchDay();
  Array.prototype.forEach.call(view.querySelectorAll('.ans button'),function(b){
    var bk=+b.getAttribute('data-k');
    b.disabled=true;
    if(bk===0) b.classList.add('o');
    else if(bk===k) b.classList.add('x');
    else b.classList.add('dim');
  });
  var last=(c.i>=c.list.length);
  document.getElementById('after').innerHTML=
    '<div class="fb '+(ok?'o':'x')+'"><b>'+(ok?'○ 正解':'× 正解は「'+esc(q.a[0])+'」')+'</b><br>'+esc(q.e)+'</div>'+
    '<button class="pri next" id="nx">'+(last?'結果を見る':'次の問題へ')+'</button>';
  document.getElementById('nx').addEventListener('click',function(){
    ask();
  });
  document.getElementById('nx').scrollIntoView({block:'nearest',behavior:'smooth'});
}

function done(){
  var s=st(), c=s.cur, n=c.res.filter(function(r){ return r===true; }).length, h='';
  if(c.mode==='set'){
    var r=s.sets[c.set+1]||{best:0,times:0};
    r.best=Math.max(r.best,n); r.last=n; r.times=(r.times||0)+1; r.date=K.today();
    s.sets[c.set+1]=r;
  }
  var miss=c.list.filter(function(_,k){ return c.res[k]===false; });
  h+='<p style="text-align:center;margin:0;color:var(--sub)">'+(c.mode==='set'?'セット'+(c.set+1)+' '+esc(SETS[c.set].t):'間違えた問題')+'</p>';
  h+='<div class="big">'+n+' / '+c.list.length+'</div>';
  h+='<p style="text-align:center">'+(n===c.list.length?'全問正解です。':'間違えた問題は「前に間違えた問題だけ」から、あとで解き直せます。')+'</p>';
  if(miss.length) h+='<button class="pri wide" id="again">間違えた '+miss.length+' 問だけ今やり直す</button>';
  var nx=(c.mode==='set' && c.set+1<SETS.length) ? c.set+1 : null;
  if(nx!=null) h+='<button class="'+(miss.length?'':'pri ')+'wide" id="nextset">次のセットへ：'+(nx+1)+' '+esc(SETS[nx].t)+'</button>';
  h+='<button class="wide" id="tohome">一覧へ戻る</button>';
  delete s.cur; save(s);
  view.innerHTML=h;
  if(miss.length) document.getElementById('again').addEventListener('click',function(){
    var s2=st(); s2.cur={mode:'wrong', list:miss, i:0, res:[]}; save(s2); ask();
  });
  if(nx!=null) document.getElementById('nextset').addEventListener('click',function(){ start(nx); });
  document.getElementById('tohome').addEventListener('click',home);
  scrollTo(0,0);
}

K.applyTheme();
K.header({});
K.initSW('../../');
if(st().cur) ask(); else home();
})();
</script>
</body>
</html>
